<!DOCTYPE html>

<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col select-none">

    <!-- En-tête principal -->
    <header class="h-14 bg-slate-900/90 border-b border-slate-800 px-4 flex items-center justify-between flex-shrink-0 shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                <i class="fa-solid fa-terminal text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-100 text-sm md:text-base tracking-wide flex items-center gap-2">
                    Terminus <span class="text-xs px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 text-amber-400 font-mono">ARCHIVES D'AETHELGARD</span>

        </div>
        <div class="flex items-center gap-3">

            </button>
        </div>
    </header>

        <section class="flex-1 min-h-0 bg-slate-900/90 rounded-xl border border-slate-800 flex flex-col shadow-2xl overflow-hidden">
            
            <!-- Barre de titre de la fenêtre Terminal (Fixe) -->
            <div class="h-10 bg-slate-950/80 px-4 flex items-center justify-between border-b border-slate-800 flex-shrink-0 select-none">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-rose-500/80 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
                    <span class="ml-2 font-mono text-xs text-slate-400 flex items-center gap-2">
                        <i class="fa-solid fa-folder-closed text-amber-400/80"></i>
                        <span id="terminal-pwd-display">/</span>
                    </span>
                </div>
                <div class="text-xs text-slate-500 font-mono">bash v4.4 - Terminus OS</div>
            </div>

            <!-- Zone de sortie du Terminal (SEULE cette zone défile en interne) -->
            <div id="terminal-output" class="flex-1 min-h-0 overflow-y-auto p-4 font-mono text-sm space-y-2 scroll-smooth">
                <!-- Les messages et sorties s'affichent ici -->
            </div>

                <div class="flex-1 flex items-center">
                    <textarea id="terminal-input" rows="1" class="w-full bg-transparent text-slate-100 placeholder-slate-600 focus:outline-none resize-none overflow-hidden font-mono text-sm leading-tight" placeholder="Entrez votre commande..." autoFocus></textarea>
                </div>
                <button id="send-cmd-btn" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs rounded transition flex items-center gap-1">
                    <span>EXEC</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </div>
        </section>

        <!-- Colonne Droite : Objectifs & Progression (Verrouillée à la hauteur disponible) -->
        <section class="w-full lg:w-[420px] flex-shrink-0 h-full flex flex-col gap-3 min-h-0 overflow-hidden">
            
            <!-- Carte 1 : Objectif en cours (TOUJOURS VISIBLE EN HAUT À DROITE) -->
            <div class="bg-slate-900/90 rounded-xl border border-slate-800 p-4 shadow-xl flex flex-col flex-shrink-0 border-l-4 border-l-emerald-500">

                    </span>

                </div>
                
                <h2 id="quest-title" class="text-lg font-bold text-slate-100 mb-2">Chargement de la quête...</h2>
                <p id="quest-description" class="text-xs text-slate-300 leading-relaxed mb-3">...</p>
                
                <div class="p-2.5 rounded-lg bg-slate-950 border border-slate-800 mb-3">
                    <div class="text-[11px] text-emerald-400 font-bold uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-bullseye"></i> OBJECTIF EN COURS :
                    </div>
                    <div id="quest-objective" class="text-xs font-mono text-slate-200 font-medium">...</div>
                </div>

                <!-- Boutons d'Action / Indices -->
                <div class="flex items-center gap-2">
                    <button id="hint-btn" class="flex-1 py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs rounded-lg border border-slate-700 transition flex items-center justify-center gap-1.5">

                        <span id="hint-btn-text">Indice (1/2)</span>
                    </button>
                    <button id="skip-btn" class="py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg border border-slate-700 transition flex items-center gap-1.5">

                        <i class="fa-solid fa-forward text-xs"></i>
                    </button>

                </div>
            </div>

            <div class="flex-1 min-h-0 overflow-y-auto space-y-3 pr-1">
                
                <!-- Carte 2 : Navigation dans les chapitres & quêtes -->
                <div class="bg-slate-900/90 rounded-xl border border-slate-800 p-3 shadow-xl">
                    <label for="quest-select" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-compass text-slate-400"></i> Navigation dans les quêtes :
                    </label>
                    <select id="quest-select" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg p-2 font-mono focus:outline-none focus:border-emerald-500">
                        <!-- Généré par JS -->
                    </select>
                </div>

                <!-- Carte 3 : Grimoire des Commandes Apprises -->
                <div class="bg-slate-900/90 rounded-xl border border-slate-800 p-4 shadow-xl flex flex-col">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">

                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

        // ==========================================
        // 2. SYSTÈME DE FICHIERS VIRTUEL (VFS)
        // ==========================================
        let initialVFS = {
            type: "dir",
            children: {
                "cellule_oubliee": {
                    type: "dir",

        // État de l'application
        let gameState = {
            currentQuestIndex: 0,
            unlockedGrimoire: [],
            currentPath: ["cellule_oubliee"], // Démarre directement dans cellule_oubliee ou racine
            vfs: JSON.parse(JSON.stringify(initialVFS)),
            currentHintLevel: 0
        };

        // ==========================================
        // 3. LOGIQUE DU SYSTEME DE FICHIERS (VFS)
        // ==========================================
        function getNodeAtPath(pathArray) {
            let curr = gameState.vfs;
            for (let name of pathArray) {
                if (!curr || curr.type !== "dir" || !curr.children[name]) {
                    return null;
                }
                curr = curr.children[name];
            }
            return curr;
        }

        function resolvePathStr(pathStr) {
            let parts = pathStr.split('/').filter(Boolean);
            let targetPath = pathStr.startsWith('/') ? [] : [...gameState.currentPath];

            for (let part of parts) {
                if (part === '.') continue;
                if (part === '..') {
                    if (targetPath.length > 0) targetPath.pop();
                } else {
                    targetPath.push(part);
                }
            }
            return targetPath;
        }

        function formatPathStr(pathArray) {
            return '/' + pathArray.join('/');
        }

        // ==========================================
        // 4. MOTEUR DE COMMANDES & EXECUTION
        // ==========================================
        const terminalOutput = document.getElementById('terminal-output');
        const terminalInput = document.getElementById('terminal-input');
        const promptPath = document.getElementById('prompt-path');
        const terminalPwdDisplay = document.getElementById('terminal-pwd-display');

        function scrollToBottom() {
            setTimeout(() => {
                terminalOutput.scrollTop = terminalOutput.scrollHeight;
            }, 10);
        }

        function appendLine(text, type = 'normal') {
            const line = document.createElement('div');
            line.className = "leading-relaxed break-all font-mono text-sm";

            if (type === 'cmd') {
                line.className += " text-emerald-400 font-semibold flex items-start gap-1 mt-2";
                line.innerHTML = `<span class="text-emerald-500 select-none">&gt;</span> <span>${escapeHTML(text)}</span>`;
            } else if (type === 'error') {
                line.className += " text-rose-400";
                line.textContent = text;
            } else if (type === 'success') {
                line.className += " text-emerald-300 font-medium";
                line.textContent = text;
            } else if (type === 'system') {
                line.className += " text-amber-300 italic";
                line.textContent = text;
            } else {
                line.className += " text-slate-300";
                line.textContent = text;
            }

            terminalOutput.appendChild(line);
            scrollToBottom();
        }

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function processCommand(rawCmd) {
            const trimmed = rawCmd.trim();
            if (!trimmed) return;

            appendLine(rawCmd, 'cmd');

            // Gérer les pipes |
            if (trimmed.includes('|')) {
                executePipeCommand(trimmed);
                checkQuestProgression(trimmed);
                saveState();
                return;
            }

            // Gérer les redirections > et >>
            if (trimmed.includes('>') || trimmed.includes('>>')) {
                executeRedirectionCommand(trimmed);
                checkQuestProgression(trimmed);
                saveState();
                return;
            }

            // Commande simple
            const tokens = trimmed.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
            const cmd = tokens[0]?.toLowerCase();
            const args = tokens.slice(1).map(a => a.replace(/^"|"$/g, ''));

            executeSingleCommand(cmd, args, rawCmd);
            checkQuestProgression(trimmed);
            saveState();
        }

        function executeSingleCommand(cmd, args, fullRawStr) {
            const currentDirNode = getNodeAtPath(gameState.currentPath);

            switch (cmd) {
                case 'pwd':
                    appendLine(formatPathStr(gameState.currentPath));
                    break;

                case 'ls': {
                    const showHidden = args.includes('-a');
                    let targetDir = currentDirNode;
                    
                    // Si un dossier est passé en paramètre
                    const pathArg = args.find(a => !a.startsWith('-'));
                    if (pathArg) {
                        const targetPath = resolvePathStr(pathArg);
                        targetDir = getNodeAtPath(targetPath);
                    }

                    if (!targetDir || targetDir.type !== 'dir') {
                        appendLine(`ls: impossible d'accéder à '${pathArg || ''}': Aucun fichier ou dossier de ce nom`, 'error');
                        break;
                    }

                    let entries = Object.keys(targetDir.children);
                    if (!showHidden) {
                        entries = entries.filter(e => !e.startsWith('.'));
                    }

                    if (entries.length === 0) {
                        appendLine('(répertoire vide)', 'system');
                    } else {
                        const formatted = entries.map(name => {
                            const isDir = targetDir.children[name].type === 'dir';
                            return isDir ? `<span class="text-sky-400 font-bold">${name}/</span>` : `<span class="text-slate-200">${name}</span>`;
                        }).join('   ');
                        const div = document.createElement('div');
                        div.className = "py-1 font-mono text-sm";
                        div.innerHTML = formatted;
                        terminalOutput.appendChild(div);
                        scrollToBottom();
                    }
                    break;
                }

                case 'cd': {
                    const target = args[0] || '/';
                    const targetPath = resolvePathStr(target);
                    const targetNode = getNodeAtPath(targetPath);

                    if (targetNode && targetNode.type === 'dir') {
                        gameState.currentPath = targetPath;
                        updatePrompt();
                    } else {
                        appendLine(`cd: ${target}: Aucun fichier ou dossier de ce nom`, 'error');
                    }
                    break;
                }

                case 'cat': {
                    if (args.length === 0) {
                        appendLine("cat: argument manquant", 'error');
                        break;
                    }
                    const filePath = resolvePathStr(args[0]);
                    const fileNode = getNodeAtPath(filePath);
                    if (!fileNode) {
                        appendLine(`cat: ${args[0]}: Aucun fichier de ce type`, 'error');
                    } else if (fileNode.type === 'dir') {
                        appendLine(`cat: ${args[0]}: Est un dossier`, 'error');
                    } else {
                        appendLine(fileNode.content);
                    }
                    break;
                }

                case 'touch': {
                    if (!args[0]) {
                        appendLine("touch: nom de fichier manquant", 'error');
                        break;
                    }
                    const filename = args[0];
                    if (!currentDirNode.children[filename]) {
                        currentDirNode.children[filename] = { type: 'file', content: '' };
                    }
                    break;
                }

                case 'mkdir': {
                    if (!args[0]) {
                        appendLine("mkdir: nom de dossier manquant", 'error');
                        break;
                    }
                    const dirname = args[0];
                    if (!currentDirNode.children[dirname]) {
                        currentDirNode.children[dirname] = { type: 'dir', children: {} };
                    }
                    break;
                }

                case 'rm': {
                    if (!args[0]) {
                        appendLine("rm: fichier manquant", 'error');
                        break;
                    }
                    const filename = args[0];
                    if (currentDirNode.children[filename]) {
                        delete currentDirNode.children[filename];
                    } else {
                        appendLine(`rm: impossible de supprimer '${filename}': Fichier inexistant`, 'error');
                    }
                    break;
                }

                case 'mv':
                case 'cp': {
                    if (args.length < 2) {
                        appendLine(`${cmd}: arguments manquants. Syntaxe : ${cmd} source destination`, 'error');
                        break;
                    }
                    const srcName = args[0];
                    let destStr = args[1];

                    const srcNode = currentDirNode.children[srcName];
                    if (!srcNode) {
                        appendLine(`${cmd}: impossible d'accéder à '${srcName}': Aucun fichier ou dossier de ce nom`, 'error');
                        break;
                    }

                    // Résolution destination
                    let destPath = resolvePathStr(destStr);
                    let destNode = getNodeAtPath(destPath);

                    if (destNode && destNode.type === 'dir') {
                        // Si la destination est un dossier existant, on met le fichier dedans
                        destNode.children[srcName] = JSON.parse(JSON.stringify(srcNode));
                    } else {
                        // Sinon on traite comme un nouveau nom de fichier dans le dossier courant ou cible
                        const parentPath = destPath.slice(0, -1);
                        const newName = destPath[destPath.length - 1];
                        const parentNode = getNodeAtPath(parentPath);

                        if (parentNode && parentNode.type === 'dir') {
                            parentNode.children[newName] = JSON.parse(JSON.stringify(srcNode));
                        } else {
                            appendLine(`${cmd}: dossier de destination valide requis`, 'error');
                            break;
                        }
                    }

                    // Si c'était un 'mv', on supprime la source
                    if (cmd === 'mv') {
                        delete currentDirNode.children[srcName];
                    }
                    break;
                }

                case 'head': {
                    let n = 10;
                    let fileIndex = 0;
                    if (args[0] === '-n' && args[1]) {
                        n = parseInt(args[1], 10) || 10;
                        fileIndex = 2;
                    }
                    const filename = args[fileIndex];
                    if (!filename) {
                        appendLine("head: nom de fichier manquant", 'error');
                        break;
                    }
                    const fileNode = getNodeAtPath(resolvePathStr(filename));
                    if (!fileNode || fileNode.type !== 'file') {
                        appendLine(`head: impossible d'ouvrir '${filename}'`, 'error');
                    } else {
                        const lines = fileNode.content.split('\n').slice(0, n).join('\n');
                        appendLine(lines);
                    }
                    break;
                }

                case 'tail': {
                    let n = 10;
                    let fileIndex = 0;
                    if (args[0] === '-n' && args[1]) {
                        n = parseInt(args[1], 10) || 10;
                        fileIndex = 2;
                    }
                    const filename = args[fileIndex];
                    if (!filename) {
                        appendLine("tail: nom de fichier manquant", 'error');
                        break;
                    }
                    const fileNode = getNodeAtPath(resolvePathStr(filename));
                    if (!fileNode || fileNode.type !== 'file') {
                        appendLine(`tail: impossible d'ouvrir '${filename}'`, 'error');
                    } else {
                        const lines = fileNode.content.split('\n');
                        const sliced = lines.slice(Math.max(lines.length - n, 0)).join('\n');
                        appendLine(sliced);
                    }
                    break;
                }

                case 'grep': {
                    if (args.length < 2) {
                        appendLine("grep: motif et fichier requis", 'error');
                        break;
                    }
                    const pattern = args[0];
                    const filename = args[1];
                    const fileNode = getNodeAtPath(resolvePathStr(filename));
                    if (!fileNode || fileNode.type !== 'file') {
                        appendLine(`grep: ${filename}: Aucun fichier de ce type`, 'error');
                    } else {
                        const matches = fileNode.content.split('\n').filter(line => line.includes(pattern));
                        if (matches.length > 0) {
                            appendLine(matches.join('\n'));
                        }
                    }
                    break;
                }

                case 'wc': {
                    const opt = args[0];
                    const filename = args[1] || args[0];
                    const fileNode = getNodeAtPath(resolvePathStr(filename));

                    if (!fileNode || fileNode.type !== 'file') {
                        appendLine(`wc: ${filename}: Aucun fichier de ce type`, 'error');
                    } else {
                        if (opt === '-l') {
                            const count = fileNode.content.split('\n').length;
                            appendLine(`${count} ${filename}`);
                        } else if (opt === '-w') {
                            const count = fileNode.content.trim().split(/\s+/).filter(Boolean).length;
                            appendLine(`${count} ${filename}`);
                        } else {
                            const lines = fileNode.content.split('\n').length;
                            const words = fileNode.content.trim().split(/\s+/).filter(Boolean).length;
                            appendLine(`${lines} ${words} ${filename}`);
                        }
                    }
                    break;
                }

                case 'echo': {
                    appendLine(args.join(' '));
                    break;
                }

                case 'clear': {
                    terminalOutput.innerHTML = '';
                    break;
                }

                case 'help': {
                    appendLine("Commandes disponibles : pwd, ls, cd, cat, touch, mkdir, rm, mv, cp, head, tail, grep, wc, echo, clear", 'system');
                    break;
                }

                default:
                    appendLine(`Commande '${cmd}' non reconnue. Tapez 'help' pour la liste des commandes.`, 'error');
                    break;
            }
        }

        // Gestion de la redirection > et >>
        function executeRedirectionCommand(cmdStr) {
            const isAppend = cmdStr.includes('>>');
            const operator = isAppend ? '>>' : '>';
            const parts = cmdStr.split(operator);

            const leftCmd = parts[0].trim();
            const rightFile = parts[1].trim();

            if (!leftCmd || !rightFile) {
                appendLine("Erreur de syntaxe dans la redirection", 'error');
                return;
            }

            // Capturer la sortie de leftCmd
            let outputText = "";
            if (leftCmd.startsWith("echo ")) {
                outputText = leftCmd.substring(5).replace(/^"|"$/g, '');
            } else if (leftCmd.startsWith("cat ")) {
                const fName = leftCmd.substring(4).trim();
                const node = getNodeAtPath(resolvePathStr(fName));
                if (node && node.type === 'file') outputText = node.content;
            } else if (leftCmd.startsWith("grep ")) {
                const tokens = leftCmd.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
                const pattern = tokens[1]?.replace(/^"|"$/g, '');
                const filename = tokens[2];
                const node = getNodeAtPath(resolvePathStr(filename));
                if (node && node.type === 'file') {
                    outputText = node.content.split('\n').filter(l => l.includes(pattern)).join('\n');
                }
            } else {
                outputText = "Résultat généré";
            }

            // Écriture dans le fichier de destination
            const targetPath = resolvePathStr(rightFile);
            const parentPath = targetPath.slice(0, -1);
            const filename = targetPath[targetPath.length - 1];
            const parentNode = getNodeAtPath(parentPath);

            if (parentNode && parentNode.type === 'dir') {
                if (!parentNode.children[filename]) {
                    parentNode.children[filename] = { type: 'file', content: '' };
                }
                if (isAppend && parentNode.children[filename].content) {
                    parentNode.children[filename].content += '\n' + outputText;
                } else {
                    parentNode.children[filename].content = outputText;
                }
                appendLine(`✓ Redirection effectuée vers ${rightFile}`, 'success');
            } else {
                appendLine(`Redirection impossible : dossier parent introuvable`, 'error');
            }
        }

        // Gestion du Pipe |
        function executePipeCommand(cmdStr) {
            const parts = cmdStr.split('|').map(p => p.trim());
            const first = parts[0];
            const second = parts[1];

            let intermediateText = "";

            // Exécution commande 1 (cat ou grep)
            if (first.startsWith("cat ")) {
                const fName = first.substring(4).trim();
                const node = getNodeAtPath(resolvePathStr(fName));
                if (node && node.type === 'file') intermediateText = node.content;
            }

            // Exécution commande 2 (grep, etc.)
            if (second.startsWith("grep ")) {
                const pattern = second.substring(5).replace(/^"|"$/g, '').trim();
                const lines = intermediateText.split('\n').filter(l => l.includes(pattern));
                appendLine(lines.join('\n'));
            } else {
                appendLine(intermediateText);
            }
        }

        function updatePrompt() {
            const pathStr = formatPathStr(gameState.currentPath);
            promptPath.textContent = pathStr;
            terminalPwdDisplay.textContent = pathStr;
        }

        // ==========================================
        // 5. GESTION DES QUÊTES ET DU GRIMOIRE
        // ==========================================
        function updateUI() {
            const quest = QUESTS[gameState.currentPathIndex || gameState.currentQuestIndex];
            
            // MàJ En-tête quête
            document.getElementById('chapter-badge').textContent = `CHAPITRE ${quest.chapter} : ${quest.chapterTitle.toUpperCase()}`;
            document.getElementById('quest-number-badge').textContent = `Quête ${quest.id} / ${QUESTS.length}`;
            document.getElementById('quest-title').textContent = quest.title;
            document.getElementById('quest-description').textContent = quest.desc;
            document.getElementById('quest-objective').textContent = quest.objective;

            // Réinitialiser la zone d'indice
            gameState.currentHintLevel = 0;
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.add('hidden');
            document.getElementById('hint-btn-text').textContent = "Indice (1/2)";

            // Débloquer commande dans le grimoire si applicable
            if (quest.grimoireUnlock) {
                unlockGrimoire(quest.grimoireUnlock);
            }

            // Mettre à jour le sélecteur
            renderQuestSelect();
            renderGrimoire();
        }

        function checkQuestProgression(cmdEntered) {
            const currentQuest = QUESTS[gameState.currentQuestIndex];
            const targetCmd = currentQuest.cmdRequired.trim().toLowerCase();
            const userCmd = cmdEntered.trim().toLowerCase();

            // Vérification simplifiée ou exacte
            if (userCmd === targetCmd || (userCmd.includes(targetCmd) && targetCmd.length > 3)) {
                appendLine(`🎉 QUÊTE ${currentQuest.id} ACCOMPLIE !`, 'success');
                
                if (gameState.currentQuestIndex < QUESTS.length - 1) {
                    gameState.currentQuestIndex++;
                    setTimeout(() => {
                        appendLine(`--- NOUVEL OBJECTIF : ${QUESTS[gameState.currentQuestIndex].title} ---`, 'system');
                        updateUI();
                    }, 500);
                } else {
                    appendLine("👑 FÉLICITATIONS ! VOUS AVEZ RESTAURÉ LES ARCHIVES D'AETHELGARD ET TRIOMPHÉ DES 32 QUÊTES !", 'success');
                }
            }
        }

        function unlockGrimoire(unlockObj) {
            if (!gameState.unlockedGrimoire.some(g => g.cmd === unlockObj.cmd)) {
                gameState.unlockedGrimoire.push(unlockObj);
            }
        }

        function renderGrimoire() {
            const list = document.getElementById('grimoire-list');
            const count = document.getElementById('grimoire-count');

            count.textContent = `${gameState.unlockedGrimoire.length} débloquée(s)`;

            if (gameState.unlockedGrimoire.length === 0) {
                list.innerHTML = `<div id="grimoire-empty" class="text-slate-500 text-xs italic py-2 text-center">Aucune commande dans votre grimoire pour l'instant.</div>`;
                return;
            }

            list.innerHTML = gameState.unlockedGrimoire.map(item => `
                <div class="p-2 rounded bg-slate-950/80 border border-slate-800 flex flex-col gap-0.5">
                    <span class="text-emerald-400 font-bold">${item.cmd}</span>
                    <span class="text-[11px] text-slate-400 leading-tight">${item.desc}</span>
                </div>
            `).join('');
        }

        function renderQuestSelect() {
            const select = document.getElementById('quest-select');
            select.innerHTML = QUESTS.map((q, idx) => `
                <option value="${idx}" ${idx === gameState.currentQuestIndex ? 'selected' : ''}>
                    Quête ${q.id} : ${q.title} (Chap. ${q.chapter})
                </option>
            `).join('');
        }

        // ==========================================
        // 6. ÉVÉNEMENTS & INITIALISATION
        // ==========================================
        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const val = terminalInput.value;
                terminalInput.value = '';
                processCommand(val);
            }
        });

        document.getElementById('send-cmd-btn').addEventListener('click', () => {
            const val = terminalInput.value;
            terminalInput.value = '';
            processCommand(val);
        });

        // Indices
        document.getElementById('hint-btn').addEventListener('click', () => {
            const currentQuest = QUESTS[gameState.currentQuestIndex];
            const hintBox = document.getElementById('hint-box');
            const hintBtnText = document.getElementById('hint-btn-text');

            if (gameState.currentHintLevel === 0) {
                hintBox.textContent = `💡 Indice 1: ${currentQuest.hints[0]}`;
                hintBox.classList.remove('hidden');
                gameState.currentHintLevel = 1;
                hintBtnText.textContent = "Indice (2/2)";
            } else if (gameState.currentHintLevel === 1) {
                hintBox.textContent = `💡 Indice 2 (Solution): ${currentQuest.hints[1]}`;
                gameState.currentHintLevel = 2;
                hintBtnText.textContent = "Indices épuisés";
            }
        });

        // Passer la quête
        document.getElementById('skip-btn').addEventListener('click', () => {
            if (gameState.currentQuestIndex < QUESTS.length - 1) {
                gameState.currentQuestIndex++;
                appendLine(`Quête passée manuellement.`, 'system');
                updateUI();
                saveState();
            }
        });

        // Sélecteur de quêtes
        document.getElementById('quest-select').addEventListener('change', (e) => {
            gameState.currentQuestIndex = parseInt(e.target.value, 10);
            updateUI();
            saveState();
        });

        // Réinitialisation globale
        document.getElementById('reset-btn').addEventListener('click', () => {
            localStorage.removeItem('aethelgard_state');
            gameState = {
                currentQuestIndex: 0,
                unlockedGrimoire: [],
                currentPath: ["cellule_oubliee"],
                vfs: JSON.parse(JSON.stringify(initialVFS)),
                currentHintLevel: 0
            };
            terminalOutput.innerHTML = '';
            appendLine("--- RÉINITIALISATION COMPLÈTE EFFECTUÉE ---", 'system');
            updatePrompt();
            updateUI();
        });

        // Sauvegarde / Chargement LocalStorage
        function saveState() {
            localStorage.setItem('aethelgard_state', JSON.stringify(gameState));
        }

        function loadState() {
            const saved = localStorage.getItem('aethelgard_state');
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                } catch(e) {
                    console.error("Erreur de chargement du localstorage", e);
                }
            }
        }

        // Démarrage de l'application
        window.onload = () => {
            loadState();
            updatePrompt();
            updateUI();
            
            appendLine("=== TERMINUS : LES ARCHIVES D'AETHELGARD ===", 'system');
            appendLine("Entrez des commandes shell pour explorer le royaume et accomplir les 32 quêtes.", 'system');
            appendLine("Tapez 'help' à tout moment pour la liste des sortilèges.", 'system');
            appendLine("--------------------------------------------------", 'system');
        };
    </script>
</body>
</html>
